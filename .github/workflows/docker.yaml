on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '37 03 * * 3'
      timezone: "America/New_York"
jobs:
  container:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build OCI image
        env:
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ github.repository }}
          REGISTRY: ghcr.io
          REGISTRY_PACKAGE_RW: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh
